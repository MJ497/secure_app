{% extends 'base.html' %}

{% block title %}Result{% endblock %}

{% block content %}
<div class="card success">
    <h2>Operation Successful</h2>

    <p>{{ message }}</p>

    {% if secret_key %}
    <div style="margin-top:20px; padding:15px; background:#f3f4f6; border-left:5px solid #2563eb;">
        <strong>Secret Key:</strong>
        <p style="word-break: break-all;">{{ secret_key }}</p>
        <small style="color:red;">
            ⚠ Save this key securely. Without it, the file cannot be recovered.
        </small>
    </div>
    {% endif %}

    <br>

    <a class="btn" href="{{ download_url }}">Download Result</a>
</div>
{% endblock %}
