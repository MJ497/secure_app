{% extends 'base.html' %}

{% block title %}Encode{% endblock %}

{% block content %}
<div class="card">
    <h2>Encode File into Image</h2>
 {% if error %}
        <p style="color: red; font-weight: 500;">{{ error }}</p>
    {% endif %}
    <form action="/encode" method="post" enctype="multipart/form-data">
        <label>Select File to Hide:</label>
        <input type="file" name="file" required>

        <label>Select Cover Image (PNG or JPEG):</label>
        <input type="file" name="image" required>

        <button class="btn">Encode</button>
    </form>
</div>
{% endblock %}
